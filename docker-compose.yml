services:
  db:
    image: postgres:16
    environment: {POSTGRES_USER: claims, POSTGRES_PASSWORD: claims, POSTGRES_DB: claims}
    volumes: [pgdata:/var/lib/postgresql/data]
  api:
    build: .
    command: uvicorn app.api:app --host 0.0.0.0 --port 8000
    environment: {DATABASE_URL: "postgresql://claims:claims@db/claims"}
    volumes: ["./models:/srv/models", "./uploads:/srv/uploads"]
    ports: ["8000:8000"]
    depends_on: [db]
  dashboard:
    build: .
    command: streamlit run app/dashboard.py --server.port 8501 --server.address 0.0.0.0
    environment: {API_URL: "http://api:8000"}
    volumes: ["./uploads:/srv/uploads"]
    ports: ["8501:8501"]
    depends_on: [api]
volumes: {pgdata: {}}
